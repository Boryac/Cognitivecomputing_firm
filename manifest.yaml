name: cognitivecomputing-firm
version: 1.4.1
description: CCF. 弈策集团公司化多角色工作流引擎。会话内持续、工单驱动、门禁交付、风格统一、可审计可回滚。
author: Yestest Holdings Limited
license: AGPL-3.0
license_url: https://www.gnu.org/licenses/agpl-3.0.html
source_code: https://github.com/Boryac/cognitivecomputing-firm.git
entry: SKILL.md
spec: PRD.md

brand:
  name: 弈策集团
  display_name: 弈策集团
  legal_name: Yestest Holdings Limited
  tagline: ""
  logo: 透明底无字logo.png
  logo_ref_name: brand-logo.png
  logo_use: "文档封面与交付物页眉；无字标识，不附加标语或署名"
  etymology: "弈=全局推演；策=先定后动；Yestest=Yes+Test 先验后认；Holdings Limited=集团化有限追责"
  # 运行期品牌落地规则与强制手段（brand.md 5.1）
  rules: [BR-1, BR-2, BR-3, BR-4, BR-5, BR-6]
  enforcement:
    turn_step: 11            # TURN 步 11 BRAND（不可跳过）
    gate: G9                 # 交付门
    checks: [C-006, C-007]   # 品牌标识已应用 / 公司名称已标定
    script: scripts/ccf_brand.py
    deliver_fail_closed: true  # 品牌未落地时交付被拒绝（退出码非零）
  # 6.1 包内静态覆盖（11 处）
  coverage:
    - SKILL.md
    - manifest.yaml
    - README.md
    - PRD.md
    - references/brand.md
    - references/charter.md
    - assets/run.template.json
    - assets/artifact.template.yaml
    - assets/delivery.template.yaml
    - assets/gate-report.template.yaml
    - CHANGELOG.md
  # 6.2 运行期交付物覆盖（每轮，由 G9 强制）
  runtime_coverage:
    - 文档封面与页眉
    - 结项报告
    - H 点简报（H1-H4）
    - 审计包与归档包
    - 门禁报告
    - 激活请求与激活确认
    - 每轮常规输出
    - 交付记录
    - code/data 类（名称标注）

activation:
  mode: first_turn_prompt
  prompt_once_per_session: true
  on_activate: enter_bootstrap
  on_decline: log_and_continue
  on_other: treat_as_decline
  explicit_commands:
    - /ccf start
    - /yestest start
    - 调用弈策集团
    - 调用 cognitivecomputing-firm
    - 调用 CCF
  platform_realization:
    claude_code: ".claude/commands/ccf.md + SessionStart hook"
    workbuddy: "platform/workbuddy.md (SessionStart hook + .codebuddy command)"
    codex: "platform/codex.md (AGENTS.md)"

stop:
  - /ccf stop
  - /yestest stop

commands:
  - /ccf status
  - /ccf theme light
  - /ccf theme dark
  - /ccf integration off grill-me
  - /ccf license
  - /ccf skills scan
  - /ccf skills list
  - /ccf skills enable
  - /ccf skills disable
  - /ccf skills auto on/off
  - /ccf profile
  - /ccf profile rollback
  - /ccf profile reset

capabilities:
  required:
    - cross_turn_state_or_file_io
  optional:
    - sub_executor
    - code_execution
    - network
    - external_memory
    - skill_registry_read

ecosystem:
  auto_scan: true
  default_level: recommended
  compatibility_check: true
  call_timeout: 30s
  max_concurrent: 3
  real_call: true
  dispatch: outbox_inbox
  blacklist: []
  whitelist: []

integrations:
  - id: grill-me
    source: mattpocock/skills/grill-me
    install_command: npx skills add mattpocock/skills/grill-me
    direction: outbound
    optional: true
    license_independent: true
    probe_at: [bootstrap_stage_1, turn_verify]
    on_missing: prompt_once_per_run
    on_install: show_command_and_wait
    on_install_done: reprobe_once
    on_decline: log_and_continue
    on_failure: log_and_continue
    real_call: true
    disable_command: /ccf integration off grill-me

delivery:
  default_formats:
    document: pdf
    spreadsheet: excel
    presentation: pdf
    code: source
    image: png
    data: json
  pipelines:
    document: md → confirm → latex → pdf
    document_word: md → confirm → latex → pdf + docx
  conversion_fallback: true

learning:
  enabled: true
  profile_versioning: true
  auto_apply_d0: true
  auto_apply_d1: true
  blacklist: [style_law, expression_constraint, license, organization_hierarchy, gate_veto, h_point_structure, security_compliance]
  rollback_support: true

organization:
  functions:
    - id: cco
      individuals: [staff-chief, adjudicator]
    - id: coo
      individuals: [budget-keeper, resource-planner, sla-watcher]
    - id: pmo
      individuals: [decomposer, dag-builder, raci-mapper]
    - id: analyst
      individuals: [alpha, beta, gamma, delta]
      differential: [gamma]
    - id: architect
      individuals: [alpha, beta, gamma, delta]
      differential: [delta]
    - id: specialist
      individuals: [alpha, beta, gamma, delta]
      differential: [beta]
    - id: red_team
      individuals: [attacker, breaker, boundary, differential]
      differential: [differential]
    - id: style_warden
      individuals: [enforcer, terminology, accessibility, differential]
      differential: [differential]
    - id: qa
      individuals: [acceptance, compliance, trace, differential]
      differential: [differential]
    - id: integrator
      individuals: [merger, consistency, source-keeper, ecosystem]
      differential: []
    - id: learning
      individuals: [observer, pattern-miner, proposer, guardrail]
      differential: [guardrail]
    - id: archivist
      individuals: [memory-keeper, version-keeper, retro-writer, differential]
      differential: [differential]

license_files:
  - LICENSE
  - COPYING
  - NOTICE
  - AUTHORS
  - CHANGELOG.md

references:
  - references/brand.md
  - references/runbook.md
  - references/charter.md
  - references/org.md
  - references/roles.md
  - references/individuals.md
  - references/differential.md
  - references/workflow.md
  - references/microtask.md
  - references/gates.md
  - references/style.md
  - references/style-tokens.md
  - references/expression.md
  - references/persistence.md
  - references/integration-grill-me.md
  - references/ecosystem.md
  - references/delivery.md
  - references/learning.md
  - references/license.md

scripts:
  - scripts/ccf_state.py
  - scripts/ccf_route.py
  - scripts/ccf_validate.py
  - scripts/style_lint.py
  - scripts/gate_runner.py
  - scripts/integration_probe.py
  - scripts/ecosystem_scanner.py
  - scripts/skill_orchestrator.py
  - scripts/ccf_deliver.py
  - scripts/ccf_brand.py
  - scripts/ccf_adapt.py
  - scripts/individual_router.py

platform:
  - platform/README.md
  - platform/workbuddy.md
  - platform/codex.md
  - platform/workbuddy-ccf-command.md
  - platform/ccf_sessionstart.py
  - .claude/commands/ccf.md

assets:
  - assets/run.template.json
  - assets/ticket.template.yaml
  - assets/microtask.template.yaml
  - assets/artifact.template.yaml
  - assets/gate-report.template.yaml
  - assets/integration.template.yaml
  - assets/delivery.template.yaml
  - assets/profile.template.json
  - assets/individual.template.yaml

evals:
  - evals/trigger.yaml
  - evals/persistence.yaml
  - evals/decomposition.yaml
  - evals/style.yaml
  - evals/gates.yaml
  - evals/integration.yaml
  - evals/ecosystem.yaml
  - evals/delivery.yaml
  - evals/brand.yaml
  - evals/learning.yaml
  - evals/differential.yaml
