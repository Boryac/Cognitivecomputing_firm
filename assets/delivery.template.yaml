# Delivery template (assets/delivery.template.yaml)
# 约定：SCOPE 阶段标注类型，按类型匹配交付管线（PRD 7.4）。
delivery_id: DL-001
run_id: CCF-YYYY-MM-DD-NNN
ticket_id: T-001
artifact_ids: []

artifact_type: "document | spreadsheet | presentation | code | image | data | video_audio | app_service | mixed | other"
default_format: "pdf | excel | pdf | source | png | json | source | deploy | archive | default"
selected_format: ""
pipeline: ""

# 文档管线：md → 用户确认(H3) → latex → pdf；Word 需显式请求
document_pipeline:
  source_ref: ""
  confirm: "approve | approve+word | revise | reject"
  confirm_at: "ISO8601 | null"
  latex_ref: ""
  pdf_ref: ""
  word_ref: ""

format_conversion:
  used_skill: ""
  status: "ok | failed | fallback"
  fallback_to: ""
  note: ""

license_notice: "AGPL-3.0 — 见 LICENSE；来源与许可声明保留"
brand_logo: "透明底无字logo.png"
# 品牌落地记录（BR-1..BR-4）；applied 由 ccf_deliver.py 依正文校验得出，非固定值
brand:
  name: "弈策集团"
  legal_name: "Yestest Holdings Limited"
  logo: "透明底无字logo.png"
  logo_ref: ""
  applied: false
brand_check:
  passed: false
  name_found: false
  logo_found: false
  logo_refs: []
  violations: []
delivered_at: "ISO8601 | null"
version: 1